<!-- ══ CafeStash — Carrd embed blocks ══════════════════════════════════════
     Three Carrd pages, one block each. Every other deep link on the site is
     a real page (#about, #Links, #projects); these are too, so #StashSetup
     cold-loads for the same reason #about does. No head script, no globals.

     Setup in Carrd:
       1. Create three pages with these exact ids:
            StashMerch    StashCoffee    StashSetup
          (Page ids are the hash. Case matters — match them exactly.)
       2. On each page: + → Embed → Type: Code → Style: Inline
       3. Paste that page's block below.
       4. Save → Publish.

     The blocks are identical except for one word: data-stash-section.
     The tab bar and panel are drawn by stash-embed.js — don't hand-write
     tabs here, or they'll be duplicated.

     The old #cafestash page can be deleted, or kept pointing at StashMerch.
     ═══════════════════════════════════════════════════════════════════════ -->


<!-- ───── Page: StashMerch ───── -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="https://dalekcoffee.github.io/DalekCarrdSite/CafeStash/stash-embed.css">

<div class="card" data-stash-section="merch"></div>
