     One page, one embed. Carrd page id: cafestash
       + → Embed → Type: Code → Style: Inline → paste this.

     This is unchanged from what's already on the site — kept here so the

       https://dalek.coffee/?stash=coffee#cafestash
       https://dalek.coffee/?stash=setup#cafestash
     Plain https://dalek.coffee/#cafestash opens on Merch, as always.
