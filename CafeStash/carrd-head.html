<!-- ══ CafeStash deep-link router ══════════════════════════════════════════
     Where this goes in Carrd (it is NOT a Settings panel — it's an element):

       1. On the HOME page, click + → Embed
       2. Type    → Code
       3. Style   → Hidden,  then Placement → Head
       4. Code    → paste everything below, <script> tags included
       5. Save, then Publish

     Placing it on the home page matters: a cold visitor to a #Stash* link is
     exactly the case where Carrd hasn't resolved a page yet.

     Why it exists: Carrd's router reads location.hash on load and only
     recognises real page ids, falling back to home for anything else.
     #StashSetup is a tab inside the CafeStash embed, not a Carrd page, so a
     cold visit to dalek.coffee/#StashSetup would land on home.

     This runs before Carrd routes, swaps the tab hash out for the real page
     id, and hands the tab name to stash-embed.js. The shared URL stays
     exactly as it is; Carrd just never sees the part it can't parse.

     If the page id ever changes, update PAGE below.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  var PAGE = '#cafestash';
  var TABS = {
    '#stashmerch':  'merch',
    '#stashcoffee': 'coffee',
    '#stashsetup':  'setup'
  };

  /* Lets the embed know the rewrite is live, so it can keep writing the
     pretty hashes on tab clicks instead of falling back to ?stash=. */
  window.__cafeStashRouter = true;

  var original = window.location.hash || '';
  var slug = TABS[original.toLowerCase()];
  if (!slug) { return; }

  window.__cafeStashTab = slug;

  function rewrite(hash) {
    var url = window.location.pathname + window.location.search + hash;
    /* replaceState, never `location.hash =`: assigning fires hashchange, and
       Carrd's router would see the tab hash and bounce to home. */
    try { history.replaceState(null, '', url); return true; }
    catch (e) { return false; }
  }

  if (!rewrite(PAGE)) { window.location.hash = PAGE; return; }

  /* Second channel, in case the embed can't see our globals: once Carrd has
     routed, put the pretty hash back. The embed reads the hash at its own
     init and prefers it over the handoff, so whichever lands first wins and
     both agree. The URL the visitor ends up sharing stays #StashSetup. */
  var restored = false;
  function restore() {
    if (restored) { return; }
    restored = true;
    setTimeout(function () { rewrite(original); }, 0);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', restore);
  } else {
    restore();
  }
  window.addEventListener('load', restore);
}());
</script>
